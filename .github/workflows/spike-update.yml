name: Spike - Windows update

on:
  push:
    branches: ['fix/windows-update']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Bundle the app's updater module
        run: npx esbuild src/main/updates/updater.ts --bundle --platform=node --format=cjs --external:electron --outfile=spike/updater.cjs
      - name: Start the update the way the app does, then quit
        run: npx electron spike/update-spawn-spike.cjs
      - name: Was Miaozhu installed after the app quit?
        shell: pwsh
        run: |
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\desktop-agent\Miaozhu.exe'
          for ($i = 0; $i -lt 90 -and -not (Test-Path $exe); $i++) { Start-Sleep 2 }
          if (Test-Path $exe) { Write-Output "RESULT: installed $((Get-Item $exe).VersionInfo.ProductVersion)" } else { Write-Output 'RESULT: not installed'; exit 1 }
