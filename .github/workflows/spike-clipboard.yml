name: Spike - clipboard

# Feasibility check for the meme gallery idea; runs only on spike branches.
on:
  push:
    branches: ['spike/**']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run spike
        run: npx electron spike/clipboard-spike.cjs
